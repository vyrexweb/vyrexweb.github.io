<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>Mira IA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- 1. ON APPELLE LE FICHIER QUI CONTIENT LA CLÉ ICI -->
<link rel="import" href="ia.html" id="keyFile"> 
<!-- Note: Si 'import' ne marche pas sur ton navigateur, on utilise un script : -->
<script src="ia.html"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
pre,code,textarea,input{user-select:text;-webkit-user-select:text}
:root{
  --bg:#04050a;--s1:#07081200;--s2:#0b0c1a;--s3:#10112200;--s4:#161829;
  --b1:rgba(100,80,255,.07);--b2:rgba(100,80,255,.14);
  --acc:#8b5cf6;--acc2:#5b21b6;--acc3:#a78bfa;--acc4:#c4b5fd;
  --sec:#f472b6;--sec2:#ec4899;
  --t:#eef0ff;--t2:#7880b0;--t3:#31355a;
  --red:#f87171;--green:#34d399;
  --mono:'JetBrains Mono',monospace;
  --ui:'Sora',sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 15%,rgba(91,33,182,.11),transparent 60%),radial-gradient(ellipse 50% 60% at 85% 88%,rgba(236,72,153,.07),transparent 55%)}
.bgd{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 88% 88% at 50% 50%,black 10%,transparent 80%);opacity:.18}

.shell{position:relative;z-index:1;display:flex;height:100vh;height:100dvh}
.app{flex:1;min-width:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;width:100%}
@media(min-width:960px){.app{border-left:1px solid var(--b1);border-right:1px solid var(--b1)}}

.sidebar{width:258px;flex-shrink:0;display:none;flex-direction:column;background:rgba(7,8,18,.97);backdrop-filter:blur(24px);border-right:1px solid var(--b1);padding:calc(var(--st)+18px) 12px 18px;overflow-y:auto}
@media(min-width:960px){.sidebar{display:flex}}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 6px;margin-bottom:20px}
.sb-gem{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--acc2),var(--sec2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(139,92,246,.35)}
.sb-gem svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
.sb-brand{font-size:16px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.sb-brand em{font-style:normal;color:var(--acc4)}
.sb-brand small{display:block;font-size:10px;color:var(--t3);font-weight:400;margin-top:1px}
.sb-new{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--acc4);cursor:pointer;border:1px dashed rgba(139,92,246,.26);background:rgba(139,92,246,.04);transition:all .15s;margin-bottom:5px}
.sb-new:hover{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.42)}
.sb-new svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:12.5px;color:var(--t2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;position:relative}
.sb-item:hover{background:rgba(255,255,255,.04);color:var(--t)}
.sb-item.on{background:rgba(139,92,246,.11);color:var(--acc4)}
.sb-item .ci{width:13px;height:13px;flex-shrink:0;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb-it{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-del{position:absolute;right:8px;width:20px;height:20px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--t3);opacity:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.sb-item:hover .sb-del{opacity:1}
.sb-del svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none}
.sb-sp{flex:1}
.sb-foot{display:flex;align-items:center;gap:9px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--b1);border-radius:12px}
.sb-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;background:var(--acc)}
.sb-ui{font-size:12px;line-height:1.3}
.sb-ui strong{display:block;font-weight:600}
.sb-ui span{color:var(--t2);font-size:10.5px}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st)+10px) 14px 10px;border-bottom:1px solid var(--b1);flex-shrink:0;background:rgba(4,5,10,.9);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-gem{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--sec2));display:flex;align-items:center;justify-content:center;position:relative}
.hdr-gem .dot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.hdr-info h1{font-size:16px;font-weight:800;letter-spacing:-.5px;line-height:1}
.hdr-info h1 span{color:var(--acc4)}
.hdr-info p{font-size:11px;color:var(--t2);margin-top:2px}

#chat{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.welcome h2{font-size:28px;font-weight:800;letter-spacing:-.6px}
.welcome h2 em{font-style:normal;background:linear-gradient(90deg,var(--acc4),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--t2);max-width:320px;font-size:14px}

.row{display:flex;flex-direction:column;gap:4px}
.row.user{align-items:flex-end}
.row.ai{align-items:flex-start}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5}
.row.user .bubble{background:var(--acc2);color:#fff;border-bottom-right-radius:4px}
.row.ai .bubble{background:rgba(255,255,255,.05);border:1px solid var(--b2);color:var(--t);border-bottom-left-radius:4px}

.inbar{padding:12px;background:rgba(4,5,10,.95);border-top:1px solid var(--b1)}
.inrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--b2);border-radius:20px;padding:8px 12px}
#ta{flex:1;background:none;border:none;outline:none;color:var(--t);font-family:var(--ui);font-size:15px;resize:none}
.sbtn{width:36px;height:36px;border-radius:12px;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.sbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bgd"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-gem"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></div>
      <div class="sb-brand">Mira <em>IA</em><small>Intelligence Avancée</small></div>
    </div>
    <div class="sb-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouvelle discussion</div>
    <div class="sb-sp"></div>
    <div class="sb-foot">
      <div class="sb-av">U</div>
      <div class="sb-ui"><strong>Utilisateur</strong><span>Plan Gratuit</span></div>
    </div>
  </aside>

  <main class="app">
    <header class="hdr">
      <div class="hdr-l">
        <div class="hdr-gem"><div class="dot"></div></div>
        <div class="hdr-info"><h1>Mira <span>IA</span></h1><p>En ligne • Prête à aider</p></div>
      </div>
    </header>

    <div id="chat">
      <div class="welcome">
        <h2>Bonjour, je suis <em>Mira</em></h2>
        <p>Comment puis-je vous aider aujourd'hui ?</p>
      </div>
    </div>

    <div class="inbar">
      <div class="inrow">
        <textarea id="ta" placeholder="Écrivez ici..." rows="1"></textarea>
        <button class="sbtn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>
  </main>
</div>

<script>
// --- LOGIQUE POUR LIRE LA CLÉ DEPUIS IA.HTML ---

const chat = document.getElementById('chat');
const ta = document.getElementById('ta');
const btn = document.getElementById('sendBtn');

function addMsg(text, isUser = false) {
    const welcome = document.querySelector('.welcome');
    if(welcome) welcome.remove();
    
    const row = document.createElement('div');
    row.className = `row ${isUser ? 'user' : 'ai'}`;
    row.innerHTML = `<div class="bubble">${text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function askMira(prompt) {
    // 2. ON RÉCUPÈRE LA CLÉ DEPUIS LE GLOBAL CONFIG
    const key = window.MIRA_CONFIG ? window.MIRA_CONFIG.apiKey : null;

    if (!key) {
        addMsg("Erreur : Fichier ia.html non trouvé ou mal configuré.");
        return;
    }

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "mixtral-8x7b-32768",
                messages: [{ role: "user", content: prompt }]
            })
        });
        const data = await response.json();
        addMsg(data.choices[0].message.content);
    } catch (e) {
        addMsg("Désolée, j'ai rencontré un problème de connexion.");
    }
}

btn.onclick = () => {
    const msg = ta.value.trim();
    if(!msg) return;
    addMsg(msg, true);
    ta.value = "";
    askMira(msg);
};

ta.onkeydown = (e) => {
    if(e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        btn.click();
    }
};
</script>
</body>
</html>
