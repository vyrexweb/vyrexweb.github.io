<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon IA Groq</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 30px auto; background-color: #f0f2f5; }
        #chat { border: 1px solid #ddd; height: 450px; padding: 20px; overflow-y: auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .toi { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .ia { background-color: #e9ecef; color: #333; }
        .container-input { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
        button { padding: 10px 20px; background: #f55036; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d4442e; }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333;">⚡ IA Propulsée par Groq</h2>
    <div id="chat" style="display: flex; flex-direction: column;"></div>
    
    <div class="container-input">
        <input type="text" id="question" placeholder="Pose ta question ici..." onkeypress="testerEntree(event)">
        <button onclick="envoyerVersGroq()">Envoyer</button>
    </div>

    <script>
        // 👇 TA CLÉ API GROQ ICI 👇
        const MA_CLE_GROQ = "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";

        async function envoyerVersGroq() {
            const input = document.getElementById("question");
            const message = input.value.trim();
            if (!message) return;

            afficherMessage(message, "toi");
            input.value = "";

            const idAttente = afficherMessage("🤖 Réflexion en cours...", "ia");

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${MA_CLE_GROQ}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // On utilise un modèle rapide de chez Groq
                        model: "llama3-8b-8192", 
                        messages: [{ role: "user", content: message }]
                    })
                });

                const data = await response.json();
                document.getElementById(idAttente).remove();

                if (data.choices && data.choices[0]) {
                    const texteIA = data.choices[0].message.content;
                    afficherMessage(texteIA, "ia");
                } else {
                    afficherMessage("❌ Erreur : " + (data.error ? data.error.message : "Réponse inconnue"), "ia");
                }

            } catch (error) {
                console.error(error);
                document.getElementById(idAttente).remove();
                afficherMessage("❌ Erreur de connexion au serveur Groq.", "ia");
            }
        }

        function afficherMessage(texte, type) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            const id = "msg-" + Math.random().toString(36).substr(2, 9);
            div.id = id;
            div.className = "message " + type;
            div.innerText = texte;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return id;
        }

        function testerEntree(e) {
            if (e.key === "Enter") envoyerVersGroq();
        }
    </script>

</body>
</html>
