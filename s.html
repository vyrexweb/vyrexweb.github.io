<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenCast</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --text: #f0f0f0; --muted: #888;
    --red: #e74c3c; --red-dark: #c0392b;
    --blue: #3498db; --blue-dark: #2980b9;
    --green: #2ecc71;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem; padding: 2rem;
    user-select: none;
  }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .buttons { display: flex; gap: 2rem; align-items: center; justify-content: center; }
  .btn {
    width: 140px; height: 140px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; outline: none;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn-red { background: var(--red); color: white; box-shadow: 0 0 40px rgba(231,76,60,0.4); }
  .btn-red:hover:not(:disabled) { box-shadow: 0 0 60px rgba(231,76,60,0.6); }
  .btn-red.active { background: var(--red-dark); animation: pulse-red 1.5s infinite; }
  .btn-blue { background: var(--blue); color: white; box-shadow: 0 0 40px rgba(52,152,219,0.4); }
  .btn-blue:hover:not(:disabled) { box-shadow: 0 0 60px rgba(52,152,219,0.6); }
  .btn-blue.active { background: var(--blue-dark); animation: pulse-blue 1.5s infinite; }
  @keyframes pulse-red { 0%,100%{box-shadow:0 0 40px rgba(231,76,60,0.5)} 50%{box-shadow:0 0 80px rgba(231,76,60,0.9)} }
  @keyframes pulse-blue { 0%,100%{box-shadow:0 0 40px rgba(52,152,219,0.5)} 50%{box-shadow:0 0 80px rgba(52,152,219,0.9)} }
  .btn svg { width: 36px; height: 36px; fill: white; }
  .btn span { font-size: 0.75rem; }
  .room-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem;
    align-items: center; width: 100%; max-width: 480px;
  }
  .room-row { display: flex; gap: 0.75rem; width: 100%; align-items: center; }
  .room-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 1.1rem; padding: 0.6rem 1rem; letter-spacing: 0.15em;
    text-align: center; font-weight: 600; outline: none; font-family: monospace;
  }
  .room-input:focus { border-color: var(--blue); }
  .btn-small {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); padding: 0.6rem 1rem; cursor: pointer; font-size: 0.85rem;
    transition: color 0.2s, border-color 0.2s; white-space: nowrap;
  }
  .btn-small:hover { color: var(--text); border-color: #555; }
  .status { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.connected { background: var(--green); }
  .dot.connecting { background: #f39c12; animation: blink 1s infinite; }
  .dot.error { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #viewer-overlay {
    display: none; position: fixed; inset: 0; background: #000; z-index: 100;
  }
  #viewer-overlay.visible { display: block; }
  #remote-video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: crosshair; }
  #viewer-controls {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 200;
  }
  .vc-btn {
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    color: white; padding: 8px 16px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s;
  }
  .vc-btn:hover { background: rgba(255,255,255,0.15); }
  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: rgba(255,255,255,0.5); border-radius: 8px;
    padding: 6px 14px; font-size: 0.75rem; pointer-events: none; transition: opacity 1s;
  }
  .log { font-family: monospace; font-size: 0.72rem; color: #444; max-width: 480px; width: 100%; text-align: left; min-height: 1.2em; }
</style>
</head>
<body>

<h1>ScreenCast</h1>

<div class="room-panel">
  <div class="room-row">
    <input class="room-input" id="room-id" maxlength="8" placeholder="CODE SALLE" spellcheck="false" autocomplete="off">
    <button class="btn-small" id="gen-btn">Générer</button>
    <button class="btn-small" id="copy-btn">Copier</button>
  </div>
  <div class="status">
    <div class="dot" id="sdot"></div>
    <span id="stxt">En attente</span>
  </div>
</div>

<div class="buttons">
  <button class="btn btn-red" id="btn-project">
    <svg viewBox="0 0 24 24"><path d="M12 4L8 8h3v8h2V8h3L12 4zm-6 14v2h12v-2H6z"/></svg>
    <span>Projeter</span>
  </button>
  <button class="btn btn-blue" id="btn-view">
    <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-5-7l-4-4v3H6v2h6v3l4-4z"/></svg>
    <span>Afficher</span>
  </button>
</div>

<div class="log" id="log"></div>

<div id="viewer-overlay">
  <div id="viewer-controls">
    <button class="vc-btn" id="toggle-ctrl">Contrôle: ON</button>
    <button class="vc-btn" id="close-viewer">Fermer ✕</button>
  </div>
  <video id="remote-video" autoplay playsinline></video>
  <div id="hint">Échap pour fermer</div>
</div>

<script>
const ICE = [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
let peer=null, conn=null, call=null, mode=null, stream=null, ctrlOn=true;

const $= id=>document.getElementById(id);
const roomInput=$('room-id'), sdot=$('sdot'), stxt=$('stxt');
const btnP=$('btn-project'), btnV=$('btn-view');
const overlay=$('viewer-overlay'), vid=$('remote-video');
const logEl=$('log');

function log(m){ logEl.textContent='› '+m; console.log(m); }
function status(t,s=''){
  stxt.textContent=t;
  sdot.className='dot'+(s==='ok'?' connected':s==='wait'?' connecting':s==='err'?' error':'');
}
function rand(n=6){ return Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join(''); }

$('gen-btn').onclick=()=>roomInput.value=rand();
$('copy-btn').onclick=()=>navigator.clipboard.writeText(roomInput.value).then(()=>{
  $('copy-btn').textContent='Copié !'; setTimeout(()=>$('copy-btn').textContent='Copier',1500);
});
roomInput.value=rand();

function loadPeer(cb){
  if(window.Peer){cb();return;}
  const s=document.createElement('script');
  s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=cb; s.onerror=()=>status('Erreur chargement PeerJS','err');
  document.head.appendChild(s);
}

// ── PROJECTEUR ────────────────────────────────────────────────────────────────
btnP.onclick=async()=>{
  if(mode){stopAll();return;}
  const room=roomInput.value.trim().toUpperCase();
  if(!room){status('Entre un code salle','err');return;}
  status('Capture écran...','wait');
  try{
    stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});
  }catch(e){status('Capture annulée','err');return;}
  stream.getVideoTracks()[0].onended=()=>stopAll();
  loadPeer(()=>initProj(room));
};

function initProj(room){
  mode='projector'; btnP.classList.add('active'); btnV.disabled=true;
  const pid='proj-'+room;
  peer=new Peer(pid,{host:'0.peerjs.com',port:443,secure:true,config:{iceServers:ICE}});

  peer.on('open',id=>{
    log('Projecteur prêt: '+id);
    status('En attente viewer · code: '+room,'wait');
  });

  // Viewer ouvre un DataChannel → on sait qui il est → on l'appelle
  peer.on('connection',c=>{
    conn=c;
    log('Viewer connecté: '+c.peer);
    conn.on('open',()=>{
      status('Viewer connecté, envoi flux...','wait');
      // On appelle directement le viewer avec notre stream
      const mc=peer.call(c.peer, stream);
      mc.on('error',e=>log('call err: '+e));
      call=mc;
      log('Appel vidéo → '+c.peer);
      status('Streaming ✓','ok');
    });
    conn.on('data', handleCtrl);
    conn.on('close',()=>{status('Viewer parti','wait'); log('DC fermé');});
  });

  peer.on('error',e=>{
    const t=e.type||e.message;
    status(t==='unavailable-id'?'Code déjà pris, génère-en un autre':'Erreur: '+t,'err');
    log('Peer err: '+t);
  });
}

// ── VIEWER ────────────────────────────────────────────────────────────────────
btnV.onclick=()=>{
  if(mode){stopAll();return;}
  const room=roomInput.value.trim().toUpperCase();
  if(!room){status('Entre le code salle','err');return;}
  loadPeer(()=>initView(room));
};

function initView(room){
  mode='viewer'; btnV.classList.add('active'); btnP.disabled=true;
  const myId='view-'+room+'-'+rand(4);
  peer=new Peer(myId,{host:'0.peerjs.com',port:443,secure:true,config:{iceServers:ICE}});

  peer.on('open',id=>{
    log('Viewer ID: '+id);
    status('Connexion au projecteur...','wait');
    // Ouvre DataChannel vers proj-ROOM (ça déclenche peer.on('connection') côté proj)
    conn=peer.connect('proj-'+room,{reliable:true});
    conn.on('open',()=>{ log('DC ouvert, attente appel vidéo...'); status('Connecté, attente vidéo...','wait'); });
    conn.on('error',e=>{ log('DC err: '+e); status('Erreur DC','err'); });
    conn.on('close',()=>{ status('Connexion perdue','err'); hideOverlay(); });
  });

  // Le projecteur nous appelle avec son flux vidéo
  peer.on('call',c=>{
    log('Appel vidéo reçu du projecteur !');
    call=c;
    call.answer(); // Pas de flux à envoyer
    call.on('stream',s=>{
      log('Flux reçu ✓');
      vid.srcObject=s;
      vid.play().catch(()=>{});
      showOverlay();
      status('Affichage en cours ✓','ok');
    });
    call.on('error',e=>{ log('call err: '+e); status('Erreur vidéo','err'); });
  });

  peer.on('error',e=>{
    const t=e.type||e.message;
    status(t==='peer-unavailable'?'Projecteur introuvable — vérifie le code':'Erreur: '+t,'err');
    log('Peer err: '+t);
  });
}

// ── OVERLAY + CONTRÔLE ────────────────────────────────────────────────────────
function showOverlay(){ overlay.classList.add('visible'); setupCtrl(); setTimeout(()=>$('hint').style.opacity='0',4000); }
function hideOverlay(){ overlay.classList.remove('visible'); removeCtrl(); }

$('close-viewer').onclick=()=>stopAll();
$('toggle-ctrl').onclick=()=>{ ctrlOn=!ctrlOn; $('toggle-ctrl').textContent='Contrôle: '+(ctrlOn?'ON':'OFF'); };

function send(d){ if(conn&&conn.open) conn.send(d); }

let lt=0;
function pos(e){
  const r=vid.getBoundingClientRect();
  const vw=vid.videoWidth||1920, vh=vid.videoHeight||1080;
  const sc=Math.min(r.width/vw,r.height/vh);
  const ox=(r.width-vw*sc)/2, oy=(r.height-vh*sc)/2;
  return {x:Math.max(0,Math.min(1,(e.clientX-r.left-ox)/(vw*sc))),
          y:Math.max(0,Math.min(1,(e.clientY-r.top-oy)/(vh*sc)))};
}

const eMove=e=>{if(!ctrlOn)return; const n=Date.now();if(n-lt<16)return;lt=n;const p=pos(e);send({type:'mousemove',x:p.x,y:p.y});};
const eDown=e=>{if(!ctrlOn)return;const p=pos(e);send({type:'mousedown',x:p.x,y:p.y,b:e.button});};
const eUp  =e=>{if(!ctrlOn)return;const p=pos(e);send({type:'mouseup',x:p.x,y:p.y,b:e.button});};
const eWheel=e=>{if(!ctrlOn)return;e.preventDefault();send({type:'wheel',dx:e.deltaX,dy:e.deltaY});};
const eKD  =e=>{if(!ctrlOn)return;if(e.key==='Escape'){stopAll();return;}e.preventDefault();send({type:'keydown',key:e.key,code:e.code,ctrl:e.ctrlKey,shift:e.shiftKey,alt:e.altKey,meta:e.metaKey});};
const eKU  =e=>{if(!ctrlOn)return;send({type:'keyup',key:e.key,code:e.code});};

function setupCtrl(){
  vid.addEventListener('mousemove',eMove);
  vid.addEventListener('mousedown',eDown);
  vid.addEventListener('mouseup',eUp);
  vid.addEventListener('wheel',eWheel,{passive:false});
  vid.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',eKD);
  document.addEventListener('keyup',eKU);
}
function removeCtrl(){
  vid.removeEventListener('mousemove',eMove);
  vid.removeEventListener('mousedown',eDown);
  vid.removeEventListener('mouseup',eUp);
  vid.removeEventListener('wheel',eWheel);
  document.removeEventListener('keydown',eKD);
  document.removeEventListener('keyup',eKU);
}

function handleCtrl(d){
  if(!d||!d.type) return;
  if(d.type==='mousemove'){
    let c=document.getElementById('pc');
    if(!c){c=document.createElement('div');c.id='pc';c.style.cssText='position:fixed;width:14px;height:14px;border-radius:50%;background:rgba(52,152,219,0.8);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);';document.body.appendChild(c);}
    c.style.left=(d.x*100)+'vw'; c.style.top=(d.y*100)+'vh';
  }
}

// ── STOP ──────────────────────────────────────────────────────────────────────
function stopAll(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  try{if(call)call.close();}catch(e){}call=null;
  try{if(conn)conn.close();}catch(e){}conn=null;
  try{if(peer)peer.destroy();}catch(e){}peer=null;
  mode=null;
  btnP.classList.remove('active');btnV.classList.remove('active');
  btnP.disabled=false;btnV.disabled=false;
  hideOverlay(); vid.srcObject=null;
  const c=document.getElementById('pc');if(c)c.remove();
  status('Déconnecté'); log('');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='viewer')stopAll();});
</script>
</body>
</html>
